<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artogram - Offline Mode</title>
  <style>
    body {
      background-color: #FAF7F2;
      color: #3D271D;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      background-color: #E8DEC8;
      color: #5C6B47;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.05em;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 12px;
      color: #C85A32;
    }
    p {
      max-width: 480px;
      line-height: 1.6;
      color: #55443B;
      margin: 0 0 24px;
    }
    button {
      background-color: #C85A32;
      color: #FAF7F2;
      border: none;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #A9431E;
    }
  </style>
</head>
<body>
  <div class="badge">ARTOGRAM PWA</div>
  <h1>You Are Currently Offline</h1>
  <p>Artogram is operating in cached mode. Cached artwork cards, public verification records, and saved items remain available offline. Submitting new artwork registrations, comments, likes, and reports will resume when internet connectivity is re-established.</p>
  <button onclick="window.location.reload()">Check Connection & Retry</button>
</body>
</html>
