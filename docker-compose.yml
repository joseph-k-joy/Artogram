services:
  db:
    image: postgres:16-alpine
    container_name: artogram_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: artogram_db
      POSTGRES_USER: artogram_user
      POSTGRES_PASSWORD: artogram_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artogram_user -d artogram_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
